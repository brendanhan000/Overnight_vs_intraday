[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ovi"
version = "0.1.0"
description = "Overnight vs. Intraday return decomposition & backtest (Lou, Polk & Skouras 2019)"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=12.0",
  "requests>=2.28",
  "PyYAML>=6.0",
  "yfinance>=0.2",
  "lxml>=4.9",
  "statsmodels>=0.14",
  "scipy>=1.10",
  "pandas-datareader>=0.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ovi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
